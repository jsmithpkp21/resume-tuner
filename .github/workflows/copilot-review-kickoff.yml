name: Copilot Review Kickoff

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  kickoff:
    name: Kick Off Copilot Review
    runs-on: ubuntu-24.04
    steps:
      - name: Post @copilot review kickoff comment
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const shortSha = pr.head.sha.slice(0, 7);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `@copilot review\n\nAuto-kickoff after push \`${shortSha}\`.`,
            });
