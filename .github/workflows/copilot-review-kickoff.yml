name: Copilot Review Kickoff

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  issues: write

jobs:
  kickoff:
    name: Kick Off Copilot Review
    runs-on: ubuntu-24.04
    steps:
      - name: Post @copilot review kickoff comment
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const shortSha = pr.head.sha.slice(0, 7);
            const marker = `Auto-kickoff after push \`${shortSha}\`.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const alreadyPosted = comments.some((comment) => {
              const body = typeof comment.body === 'string' ? comment.body : '';
              const author = comment.user?.login ?? '';
              return author === 'github-actions[bot]' && body.includes(marker);
            });

            if (alreadyPosted) {
              core.info(`Kickoff already posted for ${shortSha}; skipping duplicate comment.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `@copilot review\n\n${marker}`,
            });
