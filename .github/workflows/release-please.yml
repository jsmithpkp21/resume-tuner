name: release-please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write
  pull-requests: write
  # Note: These permissions allow the workflow to create PRs and push to protected branches,
  # but the repository setting "Allow GitHub Actions to create and approve pull requests"
  # must also be enabled for this to work with branch protection rules.
  # See: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/allowing-deployments-and-builds-to-approve-pull-requests

jobs:
  release:
    runs-on: ubuntu-latest
    # Grant elevated permissions for this job
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4.1.4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          # release-type is intentionally omitted: config-file is the single source of
          # truth. Including it alongside config-file bypasses extra-files and changelog-path.
          skip-github-pull-request: false

      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Sync version metadata after release
        if: ${{ steps.release.outputs.release_created }}
        # Branch protection rejects direct pushes to main (GH013), so a
        # non-empty drift here is opened as a follow-up PR instead. The step
        # is also marked continue-on-error so any unexpected failure (PR
        # collision on re-run, transient gh failure) cannot abort the
        # release job and skip Docker build/push or release/stable update.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Restore HEAD to the release commit unconditionally on exit so
          # downstream release/stable update pins to the released tree, not
          # the sync branch — even if push/gh-pr-create fail and the script
          # exits early under `set -e` paired with continue-on-error: true.
          release_sha="${{ steps.release.outputs.sha }}"
          restore_head() {
            if ! git switch --detach "$release_sha"; then
              echo "::warning::Failed to detach HEAD to release SHA $release_sha; downstream steps may run from the wrong tree"
              return
            fi
            current=$(git rev-parse HEAD)
            if [ "$current" != "$release_sha" ]; then
              echo "::warning::HEAD ($current) does not match release SHA ($release_sha) after restore"
            fi
          }
          trap restore_head EXIT
          python3 scripts/validate_version_sync.py --root . --fix
          git add VERSION .pyproject.meta.toml pyproject.toml .release-please-manifest.json
          if git diff --cached --quiet; then
            echo "No version-metadata drift; nothing to sync."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          sync_branch="chore/post-release-sync-${{ steps.release.outputs.tag_name }}"
          # `git switch -C` is idempotent across workflow re-runs: it replaces
          # any pre-existing local branch left by a previous attempt. Pair
          # with `--force-with-lease` so we only overwrite the remote branch
          # if it still points where we last saw it (or doesn't exist).
          git switch -C "$sync_branch"
          git commit -m "chore(release): sync version metadata [skip ci]"
          git push --force-with-lease -u origin "$sync_branch"
          # Preflight gh auth before any gh calls. AGENTS.md requires this
          # because a stale/expired GITHUB_TOKEN env var silently overrides
          # stored credentials and produces HTTP 401s; without the preflight
          # the failure surfaces only as an opaque non-zero exit deep in
          # the script.
          if ! gh auth status; then
            echo "::error::gh CLI is not authenticated; cannot open sync PR. Check GH_TOKEN/GITHUB_TOKEN."
            exit 1
          fi
          # Re-runs may find an open PR from a prior attempt; only create
          # one if none exists. The branch was just refreshed above, so an
          # existing PR will pick up the new commit automatically.
          # `gh pr list` returns an empty array (exit 0) when nothing matches,
          # so a non-zero exit here means a real auth/network failure rather
          # than "no PR found" — and stderr is left visible so the diagnostic
          # surfaces in the run log.
          existing_pr_count=$(gh pr list --head "$sync_branch" --state open --json number --jq 'length')
          if [ "$existing_pr_count" -gt 0 ]; then
            echo "Sync PR for $sync_branch already exists; updated with latest drift fix."
          else
            gh pr create \
              --base main \
              --head "$sync_branch" \
              --title "chore(release): sync version metadata after ${{ steps.release.outputs.tag_name }}" \
              --body "Auto-generated by release-please workflow to sync version metadata after ${{ steps.release.outputs.tag_name }}. Direct push to main is blocked by branch protection (GH013); merging this PR applies the drift fix. See issue #275 for context."
          fi

      - name: Detect Docker input changes
        if: ${{ steps.release.outputs.release_created }}
        id: docker_inputs
        run: |
          set -euo pipefail
          changed=false
          before="${{ github.event.before }}"
          docker_inputs=(
            ".conventionalcommits.json"
            ".markdownlint.yaml"
            ".pre-commit-config.yaml"
            "commitlint.config.mjs"
            "Dockerfile"
            "Makefile"
            "requirements.txt"
            "scripts"
            "tests"
            "tooling.toml"
          )
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed=true
          elif ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed=true
          else
            # Filter docker_inputs to paths that exist in EITHER tree (before or
            # release sha). Working-tree existence alone would hide deletions: an
            # input present at $before but removed in the release sha would be
            # dropped from the pathspec, masking the change. Checking both trees
            # keeps removals visible while avoiding missing-pathspec brittleness
            # in lean consumers that never had a given path.
            existing_inputs=()
            for p in "${docker_inputs[@]}"; do
              if git cat-file -e "$before:$p" 2>/dev/null \
                  || git cat-file -e "${{ github.sha }}:$p" 2>/dev/null; then
                existing_inputs+=("$p")
              fi
            done
            if [ "${#existing_inputs[@]}" -eq 0 ]; then
              changed=false
            else
              mapfile -t changed_files < <(
                git diff --name-only "$before" "${{ github.sha }}" -- "${existing_inputs[@]}"
              )
              if [ "${#changed_files[@]}" -gt 0 ]; then
                changed=true
              fi
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub auth configuration
        id: dockerhub_auth
        if: ${{ steps.release.outputs.release_created }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is set but DOCKERHUB_TOKEN is missing."
            exit 1
          fi
          if [ -z "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN is set but DOCKERHUB_USERNAME is missing."
            exit 1
          fi
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub (optional)
        if: ${{ steps.release.outputs.release_created && steps.dockerhub_auth.outputs.enabled == 'true' }}
        uses: docker/login-action@v4.1.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/setup-buildx-action@v4.0.0

      - name: Extract Python and pip versions
        if: ${{ steps.release.outputs.release_created }}
        id: versions
        run: |
          # Extract Python version from tooling.toml [python] section (DRY layout - source of truth)
          # Use awk stateful parser to properly handle section boundaries
          PYTHON_VERSION=""
          if [ -f tooling.toml ]; then
            PYTHON_VERSION=$(awk '
              /^[[:space:]]*\[python\]/ {
                in_python = 1
                next
              }
              /^[[:space:]]*\[/ {
                in_python = 0
              }
              in_python && /^[[:space:]]*version[[:space:]]*=/ {
                sub(/.*version[[:space:]]*=[[:space:]]*"/, "")
                sub(/".*/, "")
                print
                exit
              }
            ' tooling.toml)
          fi

          # Fallback to pyproject.toml for backward compatibility (repos that still have [project])
          if [ -z "$PYTHON_VERSION" ]; then
            PYTHON_VERSION=$(grep -E 'requires-python' pyproject.toml | grep -oE '[0-9]+\.[0-9]+' | head -1)
          fi

          # Fail fast if Python version is missing
          if [ -z "$PYTHON_VERSION" ]; then
            echo "ERROR: Could not extract Python version from tooling.toml or pyproject.toml"
            echo "Please ensure tooling.toml has [python] section with version field"
            exit 1
          fi

          # Extract pip version from tooling.toml
          PIP_VERSION=""
          if [ -f tooling.toml ]; then
            PIP_VERSION=$(grep -E '^pip' tooling.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          fi

          echo "python_version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "pip_version=$PIP_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted versions: Python=$PYTHON_VERSION, pip=$PIP_VERSION"

      - name: Extract repository name
        if: ${{ steps.release.outputs.release_created }}
        id: repo_info
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "repo_owner=$REPO_OWNER" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for reusable GHCR latest image
        if: ${{ steps.release.outputs.release_created }}
        id: ghcr_cache
        run: |
          set -euo pipefail
          image="ghcr.io/${{ steps.repo_info.outputs.repo_owner }}/${{ steps.repo_info.outputs.repo_name }}:latest"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        if: ${{ steps.release.outputs.release_created && (steps.docker_inputs.outputs.changed == 'true' || steps.ghcr_cache.outputs.cache_hit != 'true') }}
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.repo_info.outputs.repo_owner }}/${{ steps.repo_info.outputs.repo_name }}:${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
            ghcr.io/${{ steps.repo_info.outputs.repo_owner }}/${{ steps.repo_info.outputs.repo_name }}:${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
            ghcr.io/${{ steps.repo_info.outputs.repo_owner }}/${{ steps.repo_info.outputs.repo_name }}:latest
          build-args: |
            PYTHON_VERSION=${{ steps.versions.outputs.python_version }}
            PIP_VERSION=${{ steps.versions.outputs.pip_version }}

      - name: Re-tag existing GHCR image without rebuild
        if: ${{ steps.release.outputs.release_created && steps.docker_inputs.outputs.changed != 'true' && steps.ghcr_cache.outputs.cache_hit == 'true' }}
        run: |
          set -euo pipefail
          base="ghcr.io/${{ steps.repo_info.outputs.repo_owner }}/${{ steps.repo_info.outputs.repo_name }}"
          docker buildx imagetools create \
            -t "$base:${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}" \
            -t "$base:${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}" \
            -t "$base:latest" \
            "$base:latest"

      - name: Update release/stable branch
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # HEAD points to the post-sync commit if version metadata drifted, or to
          # the release commit if no sync was needed. Using git rev-parse HEAD pins
          # release/stable to the exact intended commit without a fetch, avoiding a
          # race where an unrelated push could land on main between the sync step
          # and this fetch.
          STABLE_SHA=$(git rev-parse HEAD)
          git branch -f release/stable "$STABLE_SHA"
          git push --force-with-lease origin release/stable

          echo "Updated release/stable branch to $STABLE_SHA"
