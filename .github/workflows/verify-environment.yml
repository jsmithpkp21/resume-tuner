name: Verify Environment

on:
  push:
    # Restrict push trigger to protected/release branches so PR branch pushes only
    # fire once via the pull_request trigger, eliminating duplicate runs.
    # Feature branches (feat/**, epic/**) are intentionally excluded here because
    # they always have a corresponding PR, which triggers the workflow via pull_request.
    branches:
      - main
      - release/stable
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs if a new push is made to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.build_inputs.outputs.ENV_VERSION }}
      python_version: ${{ steps.build_inputs.outputs.PYTHON_VERSION }}
      pip_version: ${{ steps.build_inputs.outputs.PIP_VERSION }}
      repo_name: ${{ steps.build_inputs.outputs.REPO_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Read build inputs from setup files
        id: build_inputs
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          # Extract repo name from github.repository (owner/repo -> repo)
          github_repo = os.environ.get("GITHUB_REPOSITORY", "unknown/project")
          repo_name = github_repo.split("/")[-1]

          # Strip optional `# x-release-please-version` annotation (issue #272).
          _version_lines = (root / "VERSION").read_text(encoding="utf-8").splitlines()
          _version_first = _version_lines[0] if _version_lines else ""
          version = _version_first.split("#", 1)[0].strip()
          if not version:
              raise SystemExit("VERSION file is empty")

          # Prefer tooling.toml as source of truth for Python/pip versions (DRY layout)
          py_ver = ""
          pip_ver = ""
          tooling_file = root / "tooling.toml"
          if tooling_file.exists():
              tooling = tomllib.loads(tooling_file.read_text(encoding="utf-8"))
              py_ver = tooling.get("python", {}).get("version", "")
              pip_ver = tooling.get("tooling", {}).get("pip", "")

          # Backward compatibility: fallback to pyproject.toml for repos with [project]
          if not py_ver:
              pyproject = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
              requires = pyproject.get("project", {}).get("requires-python", "")
              py_ver = re.sub(r"^[^0-9]*", "", requires)

          if not py_ver:
              raise SystemExit("Could not parse python version from tooling.toml or pyproject.toml")

          py_ver = re.sub(r"^[^0-9]*", "", py_ver)

          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              "\n".join(
                  [
                      f"ENV_VERSION={version}",
                      f"PYTHON_VERSION={py_ver}",
                      f"PIP_VERSION={pip_ver}",
                      f"REPO_NAME={repo_name}",
                  ]
              )
              + "\n"
          )
          PY
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Compute Docker input fingerprint
        id: docker_inputs
        # Cache key is derived from files that actually shape the runtime image
        # (base + system deps + Python deps + image-build glue), NOT every tracked
        # file in the repo. The Dockerfile still does `COPY . .`, so the cached
        # image's baked-in code can drift from the PR branch — `test-fast`,
        # `test-slow`, and `verify` therefore mount the workspace at runtime so
        # they always exercise the PR's actual code, not whatever the cache hit
        # served. See issue #297 for the perf rationale.
        #
        # To extend the fingerprint in a consumer (e.g. a generated requirements
        # file or extra meta), drop a newline-delimited list of repo-relative
        # paths into `.github/extra-fingerprint-files.txt` (tracked, optional).
        # Comments (#) and blank lines are ignored.
        run: |
          set -euo pipefail
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "ERROR: Not inside a git work tree; cannot compute build-context fingerprint."
            exit 1
          fi

          # Files whose contents actually influence the Docker image. Keep this
          # list aligned with the Dockerfile: any path the Dockerfile reads
          # before `COPY . .` (system deps, Python deps, build args) AND any
          # path the Dockerfile executes during the build (e.g. the
          # `RUN ... scripts/verify_env.sh` step) belongs here. Files COPY'd
          # into the image but only used at runtime do NOT belong here —
          # those are mounted by downstream jobs.
          allowlist=(
            "Dockerfile"
            ".dockerignore"
            "requirements.txt"
            "requirements-dev.txt"
            "pyproject.toml"
            ".pyproject.meta.toml"
            "tooling.toml"
            "VERSION"
            # Executed by the Dockerfile at build time; a change here changes
            # whether the image build succeeds. Excluding it would let a
            # stale cached tarball mask a verification-logic regression.
            "scripts/verify_env.sh"
          )

          extra_file=".github/extra-fingerprint-files.txt"
          if [ -f "$extra_file" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              # Strip leading/trailing whitespace; skip blanks and comments.
              trimmed="${line#"${line%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              [ -z "$trimmed" ] && continue
              case "$trimmed" in \#*) continue ;; esac
              # Reject path-traversal and absolute paths defensively.
              case "$trimmed" in
                /*|*..*)
                  echo "ERROR: $extra_file entry rejected (absolute or traversal): $trimmed"
                  exit 1
                  ;;
              esac
              allowlist+=("$trimmed")
            done < "$extra_file"
          fi

          present=()
          for f in "${allowlist[@]}"; do
            if [ -f "$f" ]; then
              present+=("$f")
            fi
          done

          if [ "${#present[@]}" -eq 0 ]; then
            echo "ERROR: No image-affecting files found for build-context fingerprint."
            echo "Expected at least one of: ${allowlist[*]}"
            exit 1
          fi

          echo "Fingerprinting ${#present[@]} file(s):"
          printf '  %s\n' "${present[@]}"

          printf '%s\0' "${present[@]}" \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            | awk '{print "hash=" $1}' >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub auth configuration
        id: dockerhub_auth
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is set but DOCKERHUB_TOKEN is missing."
            exit 1
          fi
          if [ -z "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN is set but DOCKERHUB_USERNAME is missing."
            exit 1
          fi
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub (optional)
        if: ${{ steps.dockerhub_auth.outputs.enabled == 'true' }}
        uses: docker/login-action@v4.1.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pass the runner's UID/GID as build args so the in-container `app`
      # user matches the bind-mounted workspace owner. Without this, lint /
      # test / verify jobs (which mount ${{ github.workspace }} into /repo)
      # fail to write tool caches like `.ruff_cache` because the container
      # would run as the default UID 1000 against a workspace owned by the
      # runner (typically UID 1001). See issue #322.
      #
      # Computed BEFORE the cache restore so the IDs participate in the
      # cache key — a runner image upgrade that changes the UID would
      # otherwise serve a stale cached tarball baked for the old UID,
      # silently reintroducing the bind-mount permission mismatch.
      - name: Compute runner host UID/GID
        id: host_ids
        run: |
          {
            echo "HOST_UID=$(id -u)"
            echo "HOST_GID=$(id -g)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore cached Docker image tar
        id: image_cache_restore
        uses: actions/cache/restore@v5.0.4
        with:
          path: /tmp/${{ steps.build_inputs.outputs.REPO_NAME }}.tar
          key: docker-image-${{ runner.os }}-${{ steps.build_inputs.outputs.REPO_NAME }}-${{ steps.docker_inputs.outputs.hash }}-uid${{ steps.host_ids.outputs.HOST_UID }}-gid${{ steps.host_ids.outputs.HOST_GID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build Docker image with caching
        if: ${{ steps.image_cache_restore.outputs.cache-hit != 'true' }}
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.build_inputs.outputs.REPO_NAME }}:${{ steps.build_inputs.outputs.ENV_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=${{ steps.build_inputs.outputs.PYTHON_VERSION }}
            PIP_VERSION=${{ steps.build_inputs.outputs.PIP_VERSION }}
            HOST_UID=${{ steps.host_ids.outputs.HOST_UID }}
            HOST_GID=${{ steps.host_ids.outputs.HOST_GID }}

      - name: Save Docker image to artifact
        if: ${{ steps.image_cache_restore.outputs.cache-hit != 'true' }}
        run: docker save -o /tmp/${{ steps.build_inputs.outputs.REPO_NAME }}.tar ${{ steps.build_inputs.outputs.REPO_NAME }}:${{ steps.build_inputs.outputs.ENV_VERSION }}

      - name: Save Docker image tar to cache
        if: ${{ steps.image_cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.0.4
        with:
          path: /tmp/${{ steps.build_inputs.outputs.REPO_NAME }}.tar
          key: docker-image-${{ runner.os }}-${{ steps.build_inputs.outputs.REPO_NAME }}-${{ steps.docker_inputs.outputs.hash }}-uid${{ steps.host_ids.outputs.HOST_UID }}-gid${{ steps.host_ids.outputs.HOST_GID }}

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ steps.build_inputs.outputs.REPO_NAME }}-image
          path: /tmp/${{ steps.build_inputs.outputs.REPO_NAME }}.tar
          retention-days: 1

  lint:
    name: Lint Code
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.repo_name }}-image
          path: /tmp

      - name: Load Docker image from artifact
        run: docker load -i /tmp/${{ needs.build.outputs.repo_name }}.tar

      - name: Run linters
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ${{ needs.build.outputs.repo_name }}:${{ needs.build.outputs.version }} bash -lc 'git config --global --add safe.directory /repo && make lint'

  test-fast:
    # Phase 4 of perf epic #116 (issue #124): split the test job into fast and
    # slow halves so they run in parallel. The fast subset (~298 tests, mostly
    # logic-only) is deselected via `-m 'not slow'` and runs in ~7s; the slow
    # subset (~9 tests, real subprocesses) runs in `test-slow` below.
    #
    # The workspace is mounted with `-v` (issue #297) so the container exercises
    # the PR's actual code rather than whatever was COPY'd into the cached
    # image. The image carries the runtime (system deps, Python deps); the
    # workspace mount carries the code under test.
    name: Run Tests (fast)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.repo_name }}-image
          path: /tmp

      - name: Load Docker image from artifact
        run: docker load -i /tmp/${{ needs.build.outputs.repo_name }}.tar

      - name: Run fast tests
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ${{ needs.build.outputs.repo_name }}:${{ needs.build.outputs.version }} bash -lc 'git config --global --add safe.directory /repo && make test-fast'

  test-slow:
    # Same mount-workspace contract as test-fast: image = runtime,
    # mounted workspace = code under test (issue #297).
    name: Run Tests (slow)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.repo_name }}-image
          path: /tmp

      - name: Load Docker image from artifact
        run: docker load -i /tmp/${{ needs.build.outputs.repo_name }}.tar

      - name: Run slow tests
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ${{ needs.build.outputs.repo_name }}:${{ needs.build.outputs.version }} bash -lc 'git config --global --add safe.directory /repo && make test-slow'

  verify:
    name: Verify Environment
    runs-on: ubuntu-24.04
    needs: build
    # Same mount-workspace contract as test-fast/test-slow: image = runtime,
    # mounted workspace = code under test (issue #297). Required because the
    # narrowed Docker fingerprint can serve a cache-hit image whose baked-in
    # code is from a prior commit; mounting guarantees these checks run
    # against the PR's actual files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.repo_name }}-image
          path: /tmp

      - name: Load Docker image from artifact
        run: docker load -i /tmp/${{ needs.build.outputs.repo_name }}.tar

      - name: Verify environment
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ${{ needs.build.outputs.repo_name }}:${{ needs.build.outputs.version }} bash -lc 'git config --global --add safe.directory /repo && make verify'

      - name: Validate managed-file drift contract
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ${{ needs.build.outputs.repo_name }}:${{ needs.build.outputs.version }} bash -lc 'git config --global --add safe.directory /repo && make drift-check'

      - name: Validate workflow action pin lock
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ${{ needs.build.outputs.repo_name }}:${{ needs.build.outputs.version }} bash -lc 'git config --global --add safe.directory /repo && make action-pin-check'

      - name: Validate AGENTS.md / copilot-instructions.md drift
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ${{ needs.build.outputs.repo_name }}:${{ needs.build.outputs.version }} bash -lc 'git config --global --add safe.directory /repo && make agents-drift-check'

  consumer-contract:
    name: Consumer Contract Gate
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.repo_name }}-image
          path: /tmp

      - name: Load Docker image from artifact
        run: docker load -i /tmp/${{ needs.build.outputs.repo_name }}.tar

      - name: Run consumer contract tests
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ${{ needs.build.outputs.repo_name }}:${{ needs.build.outputs.version }} bash -lc 'git config --global --add safe.directory /repo && make consumer-contract-test'

  # Status check: passes only if all required jobs pass
  status:
    name: CI Status
    runs-on: ubuntu-24.04
    needs: [lint, test-fast, test-slow, verify, consumer-contract]
    if: always()
    steps:
      - name: Check job status
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          # Phase 4 (#124): the unified `test` job was split into
          # `test-fast` and `test-slow`. Both must pass for CI to be green.
          results = {
              "lint": needs.get("lint", {}).get("result"),
              "test-fast": needs.get("test-fast", {}).get("result"),
              "test-slow": needs.get("test-slow", {}).get("result"),
              "verify": needs.get("verify", {}).get("result"),
              "consumer-contract": needs.get("consumer-contract", {}).get("result"),
          }
          print(
              " ".join(
                  f"{job_name}={job_result}"
                  for job_name, job_result in results.items()
              )
          )
          if any(job_result != "success" for job_result in results.values()):
              print("❌ CI checks failed")
              sys.exit(1)
          print("✅ All CI checks passed")
          PY
