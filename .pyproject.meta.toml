# Project metadata — deep-merged with shared tooling configs at generation
# time by scripts/merge_pyproject.py. Two kinds of content live here:
#
#   1. The [project] section — required project-specific fields (name,
#      version, description, authors).
#   2. Optional [tool.*] override blocks — consumer-side tweaks to the
#      tooling baseline at tooling/pyproject.toml. The merge is recursive:
#      keys present here win, keys absent here inherit from tooling.
#      Use sparingly; prefer landing config changes in tooling so other
#      consumers benefit.
#
# Edits to pyproject.toml are NOT durable — that file is generated. To
# change tool config in this consumer, edit a [tool.*] block here and
# run `python3 scripts/merge_pyproject.py` to regenerate pyproject.toml.

[project]
name = "resume-builder"
version = "0.53.1"
description = "AI-driven résumé builder: relevance-scored, layout-aware, two-page PDF/DOCX output."
authors = [
    { name = "Jonathan Smith" }
]

# Optional: project-specific tool overrides (merged with tooling configs)
# Examples:
# [tool.ruff.lint]
# select = ["E", "F"]

[tool.mypy]
exclude = [
    "^sandbox/",
]

# Runtime modules live under src/resume_builder/ per issue #41. Override
# both pytest's pythonpath and setuptools' package discovery so the package
# is importable both for tests (`from resume_builder.build_resume import …`)
# and for installable builds (`pip install -e .`).
[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src",
]

[tool.setuptools.packages.find]
where = ["src"]

# Include non-Python assets shipped with packages (e.g. job_apply_kit's
# field_extractor.js, which is injected into Playwright pages at runtime
# and must travel with the wheel). Without this, `pip install` builds
# omit the .js and `from job_apply_kit import EXTRACTOR_JS` fails at
# import with FileNotFoundError.
[tool.setuptools.package-data]
job_apply_kit = ["*.js"]
