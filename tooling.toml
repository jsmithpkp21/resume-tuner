# Tooling TOML — project-specific configuration
# Update 'version' to pin a specific tooling release (tag or branch)
version = "v1.35.0"
repo = "https://github.com/jsmithpkp21/tooling"

[tooling]
pip = "24.3.1"

[python]
version = "3.11.14"
path = "/usr/bin/python3"

[runtime]
awk_impl = "gawk"
shell_tools = ["bash", "awk", "grep", "sed", "jq"]

[black]
line_length = 88
skip_string_normalization = true

[isort]
profile = "black"
line_length = 88


[mypy]
files = ["src"]
ignore_missing_imports = true
